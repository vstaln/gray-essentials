[package]
name = "gray-extras"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Gray extras: UX bundle, vim mode, themes, permissions, questions, setup, and updates"

[[bin]]
name = "gray-extras"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
toml = "0.8"
crossterm = "0.28"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
strip = true

# Dev builds: full DWARF bloats the binary and every edit pays the link.
# Line tables keep file:line in panics and backtraces; deps carry none
# (nobody steps into tokio). Need a debugger? CARGO_PROFILE_DEV_DEBUG=2
# for that one build.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[dev-dependencies]
tempfile = "3"
